---
- name: "ASCEND Research and Leadership Program - Alliance of Hispanic Serving Research Universities (HSRU)"
  detail: "PI: Wenwu Xu. Amount: $199,772. Period: 08/16/2026-08/15/2027. Title: Thermal-Elastic Processing (TEP) for Defense-Relevant Localized Interface Engineering via Coupled Atomistic Modeling and in Situ Electron Microscopy. This project develops TEP as a localized interface-engineering strategy for defense-relevant structural metals, coupling atomistic modeling with in situ electron microscopy. The project is part of the inaugural ASCEND Research and Leadership Program cohort."
  link: "https://www.hsru.org/in-the-news/inaugural-ascendr-research-program"
- name: "W. M. Keck Foundation - New Materials Processing via Electro-Nano-Pulsing (ENP)"
  detail: "PI: Elisa Torresani; Co-PIs: Wenwu Xu and Eugene Olevsky. Amount: $1,200,000. Period: 2026-2028. This project develops electro-nano-pulsing as a new materials-processing approach for rapid, localized microstructural transformation and grain-boundary engineering in advanced materials."
- name: "MolSSI / ACT-CMS Faculty Fellow"
  detail: "Molecular Sciences Software Institute. Period: 2025-2027. Project: Transforming Materials Modeling Education through LLM-Assisted Coding and HPC Integration for SDSU's First Independent Doctoral Engineering Program. This fellowship supports curriculum transformation in computational molecular/materials science through programming, data competency, computing, mentorship, and reusable curricular module development."
- name: "CSU STEM-NET Faculty Fellow"
  detail: "STEM-NET Faculty Fellows Grant Program, California State University Chancellor's Office. Faculty Fellow: Wenwu Xu. Award No. 132597-FFA-2025-1-SAN DIEGO. Amount to SDSU: $7,478, with additional institutional support. Period: 2025-2026. This fellowship supports CSU STEM faculty in developing collaborative research and education proposals, strengthening campus scholarship, and advancing STEM-NET's systemwide mission."
- name: "NSF - ECCENTRIC: A Mechanism of Flash Sintering of Ionic Ceramics"
  detail: "PI: Wenwu Xu; Co-PI: Eugene Olevsky. Amount: $328,397. Period: 05/01/2019-04/30/2023. This project investigated the mechanisms of flash sintering in ionic ceramics through atomistic modeling and experimental studies of electric-field-assisted sintering processes."
- name: "DOE - Tailoring Grain-Boundaries by Electro-Nano-Pulsing (ENP)"
  detail: "PI: Eugene Olevsky; Co-PI: Wenwu Xu. Award No. DE-SC0022244. Amount: $467,000. Period: 2021-2024. This project developed electro-nano-pulsing approaches for localized grain-boundary engineering and rapid materials processing, supported by multiscale modeling and experiments."
- name: "SDSU Grants for Established RSCA"
  detail: "PI: Wenwu Xu. Amount: $15,000. Period: 03/25/2024-09/30/2024. Title: Atomistic Structural Evolution of Electro-Nano-Pulsing Processing of Metals by Computer Simulation. This project supported atomistic computer simulations of structural evolution in metals under electro-nano-pulsing, including graduate-student support and computational resources for ENP modeling."
- name: "SDSU Faculty University Grants Program (UGP)"
  detail: "PI: Wenwu Xu. Amount: $10,000. Period: 02/01/2019-06/30/2020. Title: A Unique Experimental Apparatus for In-Situ Nanoscale Imaging of Electric Field Assisted Sintering Process. This project developed a coupled experimental and imaging setup for in-situ nanoscale SEM characterization of electric-current-assisted sintering processes, using yttria-stabilized zirconia as a benchmark material system."
- name: "CSU / CSUPERB - Nano-SCALPEL"
  detail: "PI: Wenwu Xu. Amount: $15,000. Period: 05/01/2019-12/30/2020. Title: Nano-SCALPEL: Nanoparticle Spinning Cutting, Ablation, Lysis in Plasma Environmental Liquid for Blood Clot Removal. This seed project explored magnetically actuated nanoparticle approaches for blood-clot removal."

  detail: "California State University Chancellor's Office. PI: Wenwu Xu (San Diego State University); Co-PIs: Luwen (Vivian) Huangfu (San Diego State University) and Ashley Ringer McDonald (California Polytechnic State University, San Luis Obispo). Amount: $80,000. Period: Aug. 15, 2026-Aug. 14, 2027. This multi-campus project will develop and validate AI-JUDGE to help undergraduate students identify and correct scientifically inaccurate AI-generated simulation code. It will support six paid undergraduate research assistants, engage approximately 100 students through course-integrated activities, and prepare a follow-on NSF Improving Undergraduate STEM Education proposal."

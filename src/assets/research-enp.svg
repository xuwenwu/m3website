<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Electro-nano-pulsing and grain boundaries</title>
  <desc id="desc">Scientific illustration of nanosecond electrical pulses interacting with a polycrystalline grain boundary network.</desc>
  <defs>

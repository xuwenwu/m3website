      <circle cx="560" cy="350" r="15"/>
      <circle cx="798" cy="468" r="18"/>
    </g>
  </g>
  <g transform="translate(116 138)" stroke="#171c1f" stroke-width="9" fill="none" opacity=".65">
    <circle cx="120" cy="120" r="82"/>
